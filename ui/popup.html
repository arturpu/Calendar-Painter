<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Calendar Painter</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header>
<img src="../icons/calendar-painter-48.png" alt="">
<div><strong>Calendar Painter</strong><small id="status"></small></div>
</header>
<div class="caption" data-i18n="captionColor"></div>
<div id="palette" class="palette"></div>
<div class="actions">
<button id="paint" data-i18n="paintDays"></button>
<button id="range" data-i18n="paintRange"></button>
<button id="erase" data-i18n="eraser"></button>
<button id="stop" data-i18n="stopMode"></button>
</div>

<div class="today-option">
  <label>
    <input id="today-ring" type="checkbox">
    <span data-i18n="todayRing"></span>
  </label>
  <small data-i18n="todayRingHint"></small>
</div>

<footer data-i18n="footerHint"></footer>
<script src="popup.js"></script>
</body>
</html>
